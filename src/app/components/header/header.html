<header [class]="'header--' + headerState()">
    <div class="nav-header">
        <p class="base-text">
            @if (headerState() === 'auth') {
            my-knowledge-base
            }@else {
            <ng-content></ng-content>
            }
        </p>
        @if (headerState() === 'home') {
        <app-button type="add"></app-button>
        }
    </div>
    @if (headerState() === 'home') {
    <div class="editor-header">
        <div class="d-flex aic">
            <div class="breadcrumbs primary-text">Root / directory-name / page-name</div>
            <app-button type="share"></app-button>
        </div>
        <div class="d-flex aic">
            <app-button type="share-settings">Поделиться</app-button>
            <app-button type="options" class="btn-options-header-class"></app-button>
            <app-button type="edit"></app-button>
        </div>
    </div>
    }
</header>
