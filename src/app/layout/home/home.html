<app-header headerState="home" [isEditing]="editorState === 'write'" [breadcrumbs]="breadcrumbs()"
    [hasSelectedArticle]="selectedArticle() !== null" (toggleEditor)="toggleEditorState()"
    (createArticle)="createArticle(null)" (deleteArticle)="deleteSelectedArticle()">space-name</app-header>
<div class="d-flex">
    <app-nav-tree [activeArticleId]="selectedArticleId()" [articleUpdate]="treeArticleUpdate()" [deletedArticleId]="deletedArticleId()"
        (articleSelected)="selectArticle($event)" (breadcrumbsChanged)="breadcrumbs.set($event)"
        (createChildArticle)="createArticle($event.parentId, $event.breadcrumbs)"></app-nav-tree>

    <main class="article-content" [attr.aria-busy]="isLoadingArticle()">
        @if (isLoadingArticle()) {
        <div class="article-status" role="status">
            <span class="loading-spinner" aria-hidden="true"></span>
            <span>Загрузка статьи...</span>
        </div>
        } @else if (selectedArticle()) {
        <app-editor-wrapper [state]="editorState" [article]="selectedArticle()" (contentChange)="updateDraft($event)" (titleChange)="updateTitle($event)"></app-editor-wrapper>
        } @else if (articleLoadError()) {
        <div class="article-status" role="alert">{{ articleLoadError() }}</div>
        } @else {
        <div class="article-status">Выберите статью</div>
        }
    </main>
</div>
<app-nav-footer></app-nav-footer>
